<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>PSD Picker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1e1e1e;color:#ccc;font:13px/1.5 'SF Pro Text',system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#2d2d2d;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #3a3a3a;flex-shrink:0}
header h1{font-size:13px;font-weight:600;color:#fff}
#doc-info{color:#777;font-size:12px}
.hdr-actions{margin-left:auto;display:flex;gap:6px}
button{background:#3c3c3c;border:1px solid #555;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
button:hover{background:#4a4a4a}
button.primary{background:#0e7afe;border-color:#0e7afe;color:#fff}
button.primary:hover{background:#0a6de0}
.main{display:flex;flex:1;overflow:hidden}

/* Layer tree */
.layers-panel{flex:1;overflow-y:auto;padding:4px 0}
.layer-item{}
.layer-row{display:flex;align-items:center;gap:4px;padding:2px 6px;cursor:default;min-height:24px}
.layer-row:hover{background:#252525}
.toggle{width:16px;flex-shrink:0;cursor:pointer;text-align:center;font-size:9px;color:#555;line-height:1}
.toggle:hover{color:#aaa}
.eye{width:22px;height:22px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:3px;opacity:.9}
.eye:hover{background:#333}
.eye svg{width:14px;height:14px}
.eye.off{opacity:.25}
.eye.locked{cursor:default;opacity:.15}
.thumb-btn{width:20px;height:20px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:11px;color:#555}
.thumb-btn:hover{background:#333;color:#aaa}
.thumb-preview{display:none;padding:4px 8px 8px 36px}
.thumb-preview img{max-width:100%;border-radius:4px;border:1px solid #333;display:block}
.thumb-preview .thumb-loading{color:#555;font-size:11px;padding:4px}
.type-badge{font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0;font-weight:500}
.type-g{background:#3a3020;color:#c8a44a}
.type-t{background:#1a2a3a;color:#5ab4f0}
.type-i{background:#1e2a1e;color:#6aaa6a}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.lname.dim{color:#555}
.bounds-hint{font-size:10px;color:#444;flex-shrink:0}
.children{display:none}
.children.open{display:block}

/* Export panel */
.export-panel{width:220px;background:#222;border-left:1px solid #333;display:flex;flex-direction:column;overflow:hidden}
.ep-section{padding:12px;border-bottom:1px solid #333}
.ep-label{font-size:10px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
input[type=text],input[type=number]{width:100%;background:#1a1a1a;border:1px solid #3a3a3a;color:#ddd;padding:5px 8px;border-radius:4px;font-size:12px}
input:focus{outline:none;border-color:#0e7afe}
.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.crop-grid input{width:100%}
.crop-hint{font-size:10px;color:#555;margin-top:4px}
#export-status{font-size:11px;padding:8px 12px;min-height:32px;color:#666}
.vis-summary{flex:1;overflow-y:auto;padding:12px}
.vis-list{font-size:11px;line-height:2;color:#777}
.vis-list span{display:block}
.vis-on{color:#6aaa6a}
.vis-off{color:#555;text-decoration:line-through}
</style>
</head>
<body>

<header>
  <h1>PSD Picker</h1>
  <span id="doc-info">连接中...</span>
  <div class="hdr-actions">
    <button onclick="loadLayers(false)">刷新缓存</button>
    <button onclick="loadLayers(true)">重新分析</button>
    <button onclick="resetVis()">还原可见性</button>
  </div>
</header>

<div class="main">
  <div class="layers-panel" id="tree">
    <div style="padding:40px;text-align:center;color:#444">加载图层中...</div>
  </div>

  <div class="export-panel">
    <div class="ep-section">
      <div class="ep-label">导出文件名</div>
      <input id="filename" type="text" placeholder="export_bg" value="export_bg">
    </div>
    <div class="ep-section">
      <div class="ep-label">裁剪（留空=全图）</div>
      <div class="crop-grid">
        <input id="cl" type="number" placeholder="left">
        <input id="ct" type="number" placeholder="top">
        <input id="cr" type="number" placeholder="right">
        <input id="cb" type="number" placeholder="bottom">
      </div>
      <div class="crop-hint" id="doc-size"></div>
    </div>
    <div class="ep-section">
      <button class="primary" style="width:100%" onclick="doExport()">导出 PNG → Desktop</button>
      <div id="export-status"></div>
    </div>
    <div class="vis-summary">
      <div class="ep-label">当前可见层（顶层）</div>
      <div class="vis-list" id="vis-list"></div>
    </div>
  </div>
</div>

<script>
const EYE_ON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="8" rx="6" ry="4"/><circle cx="8" cy="8" r="1.8" fill="currentColor" stroke="none"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l12 12M6.7 6.8a2 2 0 002.5 2.5"/><path d="M10.6 10.6C9.6 11.5 8.8 12 8 12c-3.9 0-7-4-7-4a12 12 0 013.4-3.4"/><path d="M4.6 4.6C5.7 3.6 6.8 3 8 3c3.9 0 7 4 7 4a12 12 0 01-1.4 1.6"/></svg>`;

let layers = [], vis = {}, docW = 0, docH = 0;

async function loadLayers(refresh = false) {
  setStatus('', '');
  document.getElementById('tree').innerHTML = '<div style="padding:40px;text-align:center;color:#444">分析图层中...</div>';
  try {
    const r = await fetch('/api/layers' + (refresh ? '?refresh=true' : ''));
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    layers = d.layers || [];
    docW = d.w; docH = d.h;
    document.getElementById('doc-info').textContent = `${d.doc}  ${d.w}×${d.h}px`;
    document.getElementById('doc-size').textContent = `文档 ${d.w}×${d.h}`;
    // Init vis from PS state
    layers.forEach((l, i) => { if (!(i in vis)) vis[i] = l.v; });
    render();
  } catch(e) {
    document.getElementById('tree').innerHTML = `<div style="padding:40px;text-align:center;color:#e55">加载失败: ${e.message}</div>`;
  }
}

function resetVis() {
  layers.forEach((l, i) => { vis[i] = l.v; });
  render();
}

function render() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  layers.forEach((l, i) => tree.appendChild(makeNode(l, i, 0, true)));
  updateSummary();
}

function makeNode(layer, topIdx, depth, isTop) {
  const wrap = document.createElement('div');
  wrap.className = 'layer-item';

  const row = document.createElement('div');
  row.className = 'layer-row';
  row.style.paddingLeft = (6 + depth * 16) + 'px';

  // Expand toggle
  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  const hasChildren = layer.g && layer.c && layer.c.length > 0;
  if (hasChildren) {
    toggle.textContent = '▶';
    toggle.onclick = () => {
      const ch = wrap.querySelector(':scope > .children');
      const open = ch.classList.toggle('open');
      toggle.textContent = open ? '▼' : '▶';
    };
  }
  row.appendChild(toggle);

  // Eye (only top-level is interactive)
  const eye = document.createElement('span');
  const curVis = isTop ? vis[topIdx] : layer.v;
  eye.className = 'eye' + (curVis ? '' : ' off') + (isTop ? '' : ' locked');
  eye.innerHTML = curVis ? EYE_ON : EYE_OFF;
  if (isTop) {
    eye.onclick = () => { vis[topIdx] = !vis[topIdx]; render(); };
  }
  row.appendChild(eye);

  // Type badge
  const badge = document.createElement('span');
  badge.className = 'type-badge ' + (layer.g ? 'type-g' : layer.k === 't' ? 'type-t' : 'type-i');
  badge.textContent = layer.g ? 'GRP' : layer.k === 't' ? 'TXT' : 'IMG';
  row.appendChild(badge);

  // Name
  const name = document.createElement('span');
  name.className = 'lname' + (curVis ? '' : ' dim');
  name.textContent = layer.n;
  name.title = layer.n;
  row.appendChild(name);

  // Bounds hint (top-bottom range)
  if (layer.b) {
    const hint = document.createElement('span');
    hint.className = 'bounds-hint';
    hint.textContent = layer.b[1] + '–' + layer.b[3];
    row.appendChild(hint);
  }

  // Thumbnail button (top-level only)
  if (isTop) {
    const preview = document.createElement('div');
    preview.className = 'thumb-preview';
    preview.innerHTML = '<div class="thumb-loading">点击预览加载中...</div>';

    const btn = document.createElement('span');
    btn.className = 'thumb-btn';
    btn.textContent = '⬚';
    btn.title = '预览此层';
    btn.onclick = () => {
      const open = preview.style.display === 'block';
      if (open) { preview.style.display = 'none'; return; }
      preview.style.display = 'block';
      if (preview.querySelector('img')) return;
      const img = document.createElement('img');
      img.onload = () => preview.querySelector('.thumb-loading') && (preview.innerHTML = '') || preview.appendChild(img);
      img.onerror = () => { preview.innerHTML = '<div class="thumb-loading" style="color:#e55">加载失败</div>'; };
      img.src = `/api/thumbnail/${topIdx}`;
      preview.innerHTML = '<div class="thumb-loading">生成中（首次较慢）...</div>';
      img.onload = () => { preview.innerHTML = ''; preview.appendChild(img); };
    };
    row.appendChild(btn);
    wrap.appendChild(row);
    wrap.appendChild(preview);
  } else {
    wrap.appendChild(row);
  }

  // Children
  if (hasChildren) {
    const ch = document.createElement('div');
    ch.className = 'children';
    layer.c.forEach(child => ch.appendChild(makeNode(child, topIdx, depth + 1, false)));
    wrap.appendChild(ch);
  }

  return wrap;
}

function updateSummary() {
  const list = document.getElementById('vis-list');
  list.innerHTML = layers.map((l, i) =>
    `<span class="${vis[i] ? 'vis-on' : 'vis-off'}">${vis[i] ? '●' : '○'} ${l.n}</span>`
  ).join('');
}

async function doExport() {
  const filename = document.getElementById('filename').value.trim() || 'export';
  const cl = document.getElementById('cl').value;
  const ct = document.getElementById('ct').value;
  const cr = document.getElementById('cr').value;
  const cb = document.getElementById('cb').value;
  const crop = (cl && ct && cr && cb) ? [+cl, +ct, +cr, +cb] : null;

  setStatus('导出中...', '#888');
  try {
    const r = await fetch('/api/export', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({filename, visibility: vis, crop})
    });
    const d = await r.json();
    if (d.ok) setStatus(`✓ Desktop/${filename}.png`, '#5c5');
    else setStatus(`✗ ${d.detail || '失败'}`, '#e55');
  } catch(e) {
    setStatus(`✗ ${e.message}`, '#e55');
  }
}

function setStatus(msg, color) {
  const el = document.getElementById('export-status');
  el.textContent = msg;
  el.style.color = color;
}

loadLayers();
</script>
</body>
</html>

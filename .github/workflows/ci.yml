name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r app/requirements.txt pytest==8.3.3
      - name: Syntax check
        run: python -m compileall -q app host-bridge.py mcp_server.py
      - name: Mock host-bridge tests
        run: PYTHONPATH=app:tests pytest tests/test_api.py -q
